# charts/hello-nginx/values.yaml
replicaCount: 1

image:
  repository: nginx
  tag: "1.25.3"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "ca-cluster-issuer"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
  - host: hello.local # Consistent domain
    paths:
    - path: /
      pathType: Prefix
  tls:
  - hosts:
    - hello.local # Consistent domain
    secretName: hello-local-tls-secret # Consistent secret name

# ... rest remains the same
