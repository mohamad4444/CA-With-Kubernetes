apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hello-tls
  namespace: default     # <- same namespace as ingress
spec:
  commonName: hello.local
  secretName: hello-local-tls-secret # <- must match ingress.spec.tls.secretName
  dnsNames:
    - hello.local
  issuerRef:
    name: my-ca-issuer
    kind: ClusterIssuer